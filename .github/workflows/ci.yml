name: 'C++ CI'

on:
  push:
    branches:
      - main
      - feature/github_actions

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions: write-all
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tools (Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc g++
      
      - name: CMake Configure (ASAN Preset)
        run: cmake --preset linux-gcc-asan

      - name: CMake Build
        run: cmake --build --preset build-linux-asan

      - name: Run Program to Test Sanitizers
        run: |
          echo "Run programm with sanitizers"
          ./out/build/linux-gcc-asan/CppProgramminLab1

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.0.${{ github.run_number }}
          release_name: Release v0.0.${{ github.run_number }}
          draft: false
          prerelease: false

      - name: Upload Release Asset 
        id: upload-release-asset 
        uses: actions/upload-release-asset@v1 
        env: 
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        with: 
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./out/build/linux-gcc-asan/CppProgramminLab1
          asset_name: CppProgramminLab1-Linux
          asset_content_type: application/octet-stream
